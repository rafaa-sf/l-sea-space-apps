name: CI

# Lightweight, secret-free continuous integration for the L-SEA Space Apps
# static application. Every push to main/develop and every pull request must
# install the locked dependencies, run the unit tests and produce a production
# build with Node.js 24. The Miro MCP server is a separate package with its own
# lockfile and test suite.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# One run per branch/PR; a newer commit cancels an outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # --passWithNoTests keeps the scaffold-stage pipeline green while the
      # unit-test suite is being written. Remove the flag once the suite exists
      # so that a missing or deleted test suite fails CI.
      - name: Run unit tests
        run: npm test -- --passWithNoTests

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/data/pois.json
          test -f dist/data/layers.json
          test -f dist/data/terrain/index.json
          test -f dist/data/ai-usage.md

  mcp-tests:
    name: Miro MCP tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/miro/package-lock.json

      - name: Install locked MCP dependencies
        run: npm --prefix mcp/miro ci --no-audit --no-fund

      - name: Run MCP tests
        run: npm --prefix mcp/miro test
