name: CI

# Lightweight, secret-free continuous integration for the L-SEA Space Apps
# static application. Every push to main/develop and every pull request must
# install the locked dependencies, run the unit tests and produce a production
# build with Node.js 24. The Miro MCP server is a separate package with its own
# lockfile and test suite.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# One run per branch/PR; a newer commit cancels an outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/data/pois.json
          test -f dist/data/layers.json
          test -f dist/data/terrain/index.json
          test -f dist/data/ai-usage.md

  mcp-tests:
    name: Miro MCP tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/miro/package-lock.json

      - name: Install locked MCP dependencies
        run: npm --prefix mcp/miro ci --ignore-scripts --no-fund

      - name: Run MCP tests
        run: npm --prefix mcp/miro test

  audit:
    name: Dependency audit gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Install locked dependencies (audit only)
        run: npm ci --ignore-scripts --no-fund

      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit MCP production dependencies
        run: npm --prefix mcp/miro audit --omit=dev --audit-level=high
